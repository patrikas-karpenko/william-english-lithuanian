<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>William</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="mascot">
    <p id="score" class="score">0/5</p>
    <p id="bubble" class="bubble"></p>
    <pre id="cat" title="Click me!"></pre>
    <p class="name">William</p>
    <button id="flip-test" class="test-btn" type="button">🐱 Salto!</button>
    <div class="menus">
      <select id="course" aria-label="Course"></select>
      <select id="lesson" aria-label="Lesson"></select>
    </div>
  </header>

  <main id="chat"></main>

  <form id="form">
    <input id="input" placeholder="Write to William…" autocomplete="off" maxlength="500">
    <button>Send</button>
  </form>

  <script src="chat.js"></script>
</body>
</html>
